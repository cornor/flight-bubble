<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>泡泡小队</title>
  <link rel="preload" as="image" href="TemplateData/loading-bg.webp" fetchpriority="high">
  <link rel="preload" as="image" href="TemplateData/loading-logo.webp" fetchpriority="high">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b2238;color:#fff;font:13px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
    main{height:100%;display:flex;align-items:center;justify-content:center}
    #stage{height:100%;max-height:100dvh;aspect-ratio:9/16;position:relative;max-width:100vw;--u:1px}
    canvas{display:block;width:100%;height:100%;background:#000;outline:none}
    #broadcast-status{display:none}
    /* Fill the same stage as the game canvas, including on wide browser windows.
       Use the selected artwork without a second, narrower portrait container. */
    /* 2026-10-30 (界面优化 1): sky-blue bubble background, the 泡泡小队 wordmark, a blue capsule bar with a green fill. */
    #loading{position:absolute;inset:0;z-index:3;overflow:hidden;background:#79c6fb;color:#fff;transition:opacity .45s ease}
    #loading.out{opacity:0;pointer-events:none}
    #lg-scene{position:relative;width:100%;height:100%;overflow:hidden;background:#79c6fb url(TemplateData/loading-bg.webp) center/cover no-repeat}
    #lg-logo{position:absolute;left:5%;width:90%;top:25%;display:block;animation:lg-float 3.2s ease-in-out infinite}
    /* the stacked wordmark (art batch 3, L1: 泡泡 over 小队 with the bear) sits like the reference */
    #lg-logo.stacked{left:12%;width:78%;top:22%}
    @keyframes lg-float{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-6))}}
    /* Live progress and health advisory stay independent of the illustration.
       The footer starts below the pot and blends into the mint field. */
    #lg-bottom{position:absolute;left:0;right:0;top:78%;bottom:0;padding:calc(var(--u)*16) 4% max(1.5%,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:calc(var(--u)*10);z-index:2}
    /* 2026-10-30 (调整 1): the reference bar - thick violet-navy frame, green fill, the percentage inside it. */
    #lg-bar-wrap{width:75%;position:relative}
    #lg-text{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*40);display:flex;align-items:center;justify-content:center;z-index:2;font-weight:800;font-size:calc(var(--u)*19);letter-spacing:.02em;white-space:nowrap;color:#fff;text-shadow:0 calc(var(--u)*1) calc(var(--u)*2) #1d1660aa;pointer-events:none}
    #lg-bar{height:calc(var(--u)*40);padding:calc(var(--u)*4);border-radius:calc(var(--u)*12);background:linear-gradient(#6f6be8,#4d48c9);box-shadow:0 calc(var(--u)*3) 0 #2d2a8a,0 calc(var(--u)*5) calc(var(--u)*8) #1d3a7a55}
    #lg-track{height:100%;overflow:hidden;border-radius:calc(var(--u)*8);background:linear-gradient(#3b32a8,#4a40bd);box-shadow:inset 0 calc(var(--u)*2) calc(var(--u)*3) #00000045}
    #lg-fill{position:relative;width:0;height:100%;border-radius:calc(var(--u)*8);background:linear-gradient(#8af27a,#2fc23e);box-shadow:inset 0 calc(var(--u)*3) 0 #ffffff70}
    #lg-health{text-align:center;width:100%;font-size:max(10px,calc(var(--u)*16));line-height:1.5;color:#29456f;font-weight:600;text-shadow:none}
    #lg-health h2{margin:0 0 calc(var(--u)*5);font-size:max(11px,calc(var(--u)*18));font-weight:700;line-height:1.3}
    #lg-health p{margin:0}
    #loading.failed #lg-text{font-size:calc(var(--u)*20);color:#ffe08a}
    #lg-bar.done{animation:lg-flash .4s ease-out}
    @keyframes lg-flash{0%{filter:brightness(1.4)}100%{filter:brightness(1)}}
    @media(prefers-reduced-motion:reduce){#lg-bar.done{animation:none}#loading{transition:none}}
  </style>
</head>
<body>
  <main>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1" aria-label="泡泡小队游戏画面"></canvas>
      <div id="loading" aria-label="泡泡小队加载页">
        <div id="lg-scene">
        <img id="lg-logo" src="TemplateData/loading-logo.webp" alt="泡泡小队" fetchpriority="high" decoding="async" onload="if(this.naturalHeight>this.naturalWidth*.7)this.classList.add('stacked')">
        <div id="lg-bottom">
          <div id="lg-bar-wrap">
            <div id="lg-text" role="status" aria-live="polite">0%</div>
            <div id="lg-bar" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="lg-track"><div id="lg-fill"></div></div>
            </div>
          </div>
          <section id="lg-health" aria-label="健康游戏忠告">
            <h2>《健康游戏忠告》</h2>
            <p>抵制不良游戏，拒绝盗版游戏。注意自我保护，谨防受骗上当。</p>
            <p>适度游戏益脑，沉迷游戏伤身。合理安排时间，享受健康生活。</p>
          </section>
        </div>
        </div>
      </div>
    </div>
  </main>
  <span id="broadcast-status" hidden aria-hidden="true"></span>
  <script>
    const canvas=document.getElementById('unity-canvas');
    const stage=document.getElementById('stage'),scene=document.getElementById('lg-scene'),loading=document.getElementById('loading');
    const bar=document.getElementById('lg-bar'),fill=document.getElementById('lg-fill'),text=document.getElementById('lg-text');
    let target=0,shown=0,done=false,finished=false,failed=false,lastPercent=-1;
    function unit(){scene.style.setProperty('--u',scene.clientWidth/540+'px');}
    unit();addEventListener('resize',unit);
    const sizeObserver=new ResizeObserver(unit);sizeObserver.observe(scene);
    function frame(){
      if(failed)return;
      shown+=(target-shown)*.12;if(target-shown<.003)shown=target;
      const p=Math.min(shown,1),percent=Math.round(p*100);
      fill.style.width=p*100+'%';
      if(percent!==lastPercent){
        text.textContent=percent+'%';
        bar.setAttribute('aria-valuenow',String(percent));lastPercent=percent;
      }
      // Unity's download callback reaches at most 96%; 100% requires successful engine startup.
      if(done&&shown>=.997&&!finished){
        finished=true;text.textContent='加载完成，出发！';bar.classList.add('done');
        setTimeout(()=>{
          loading.classList.add('out');canvas.focus();
          setTimeout(()=>{loading.remove();sizeObserver.disconnect();removeEventListener('resize',unit);},500);
        },450);
        return;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    function fail(){
      failed=true;loading.classList.add('failed');
      text.textContent='加载失败，请刷新重试';bar.setAttribute('aria-valuetext','加载失败');
    }
    // 2026-10-22 11:12 (user: text looked soft on phones): render up to 2x device pixels (was 1.5x from the original;
    // a 3x phone drew at half resolution and the browser scaled it up).
    // 2026-10-29 (performance): browsers with ASTC textures (phones, WeChat) load Build-astc, whose textures take a
    // quarter of the memory and download; others load the plain build. astcBuild is filled in by scripts/r1v3/build.sh.
    const astcBuild=null;
    const useAstc=!!astcBuild&&(()=>{try{const c=document.createElement('canvas'),g=c.getContext('webgl2')||c.getContext('webgl');
      const ok=!!(g&&g.getExtension('WEBGL_compressed_texture_astc'));const lose=g&&g.getExtension('WEBGL_lose_context');if(lose)lose.loseContext();return ok;}catch(e){return false;}})();
    const files=useAstc?astcBuild:{data:'Build/{{{ DATA_FILENAME }}}',framework:'Build/{{{ FRAMEWORK_FILENAME }}}',code:'Build/{{{ CODE_FILENAME }}}',loader:'Build/{{{ LOADER_FILENAME }}}'};
    window.gardenTextureBuild=useAstc?'astc':'plain';
    const config={dataUrl:files.data,frameworkUrl:files.framework,codeUrl:files.code,streamingAssetsUrl:'StreamingAssets',companyName:"BubbleSquad",productName:"FlightBubble",productVersion:"0.11.0",devicePixelRatio:Math.min(window.devicePixelRatio||1,2)};
    const loader=document.createElement('script');loader.src=files.loader;
    loader.onload=()=>createUnityInstance(canvas,config,p=>{target=Math.max(target,Math.min(p,1)*.96);}).then(instance=>{
      target=1;done=true;
    }).catch(error=>{console.error(error);fail();});
    loader.onerror=fail;document.body.appendChild(loader);
  </script>
</body>
</html>
