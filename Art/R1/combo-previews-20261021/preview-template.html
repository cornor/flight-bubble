<div id="combo-art-preview">
  <div class="viz-controls">
    <button class="btn btn-primary" type="button" data-action="play">播放动效</button>
    <button class="btn" type="button" data-action="pause">暂停</button>
    <label class="form-label">速度 <select class="form-select" data-control="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label>
    <label class="form-label">连击 <select class="form-select" data-control="count"><option>1000</option><option>1500</option><option>2000</option><option>3000</option></select></label>
  </div>
  <div class="viz-carousel viz-dotted-background" aria-label="四套连击动效方案" data-previous-label="上一套" data-next-label="下一套">
    <section data-variant="星爆冲击" aria-label="星爆冲击动效">
      <div class="combo-product"><canvas width="540" height="960" role="img" aria-label="星爆冲击：金色星芒向外炸开，连击数字重击弹入。实机静态背景上的动效预演。"></canvas><span class="combo-mark">实机背景 · 动效预演</span></div>
    </section>
    <section data-variant="泡泡超新星" aria-label="泡泡超新星动效" hidden>
      <div class="combo-product"><canvas width="540" height="960" role="img" aria-label="泡泡超新星：泡泡蓄能鼓起，破裂后波纹与泡泡向外释放。实机静态背景上的动效预演。"></canvas><span class="combo-mark">实机背景 · 动效预演</span></div>
    </section>
    <section data-variant="彗星穿梭" aria-label="彗星穿梭动效" hidden>
      <div class="combo-product"><canvas width="540" height="960" role="img" aria-label="彗星穿梭：星光沿斜线冲入，数字错拍出现，拖尾快速飞离。实机静态背景上的动效预演。"></canvas><span class="combo-mark">实机背景 · 动效预演</span></div>
    </section>
    <section data-variant="皇冠绽放" aria-label="皇冠绽放动效" hidden>
      <div class="combo-product"><canvas width="540" height="960" role="img" aria-label="皇冠绽放：玻璃双翼展开，皇冠轻落，星光散开。实机静态背景上的动效预演。"></canvas><span class="combo-mark">实机背景 · 动效预演</span></div>
    </section>
  </div>
  <div class="viz-row"><span data-label="phase" aria-live="polite">星爆冲击 · 爆发定格</span><span class="text-small text-muted" data-label="time">0.55 / 1.55 秒</span></div>
  <label class="form-label">时间轴 <input class="form-range" data-control="time" type="range" min="0" max="1.55" step="0.01" value="0.55" aria-label="拖动查看动效阶段"></label>
  <span class="sr-only" data-label="load" role="status">正在载入美术素材</span>
</div>
<style>
@font-face {font-family:ComboRound;src:url('@@FONT@@') format('woff2');font-display:swap;}
#combo-art-preview .combo-product {position:relative;max-width:338px;margin:10px auto 0;background:#8dd4ff;overflow:hidden;border-radius:16px;box-shadow:0 4px 18px #163f6426;}
#combo-art-preview .combo-product canvas {display:block;width:100%;height:auto;aspect-ratio:9/16;}
#combo-art-preview .combo-mark {position:absolute;left:50%;bottom:15.5%;transform:translateX(-50%);white-space:nowrap;background:#184466c9;color:#fff;border-radius:12px;padding:3px 9px;font:11px/1.5 system-ui,sans-serif;pointer-events:none;}
#combo-art-preview section {min-width:0;}
</style>
<script type="application/json" id="combo-art-data">@@ASSETS@@</script>
<script>
(() => {
  const root = document.getElementById('combo-art-preview');
  const data = JSON.parse(document.getElementById('combo-art-data').textContent);
  const sections = [...root.querySelectorAll('[data-variant]')];
  const timeline = root.querySelector('[data-control="time"]');
  const speed = root.querySelector('[data-control="speed"]');
  const count = root.querySelector('[data-control="count"]');
  const play = root.querySelector('[data-action="play"]');
  const phase = root.querySelector('[data-label="phase"]');
  const timeLabel = root.querySelector('[data-label="time"]');
  const specs = [
    {id:'starburst',name:'星爆冲击',duration:1.55,impact:.13,settle:.41,exit:.90,peak:.55,accent:'#ffc229',dark:'#a04a10',title:'火力全开！'},
    {id:'bubble-nova',name:'泡泡超新星',duration:1.8,impact:.23,settle:.58,exit:1.08,peak:.65,accent:'#39dcff',dark:'#1674ad',title:'火力全开！'},
    {id:'comet',name:'彗星穿梭',duration:1.65,impact:.22,settle:.52,exit:.97,peak:.60,accent:'#b69aff',dark:'#6150ae',title:'势不可挡！'},
    {id:'crown',name:'皇冠绽放',duration:2.05,impact:.30,settle:.68,exit:1.28,peak:.83,accent:'#ffcf60',dark:'#98601d',title:'巅峰时刻！'}
  ];
  const images = {};
  const states = specs.map(s => ({t:s.peak}));
  let active = 0, running = false, raf = 0, last = 0, ready = false;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
  const mix = (a,b,t) => a+(b-a)*t;
  const cubic = t => 1-Math.pow(1-clamp(t),3);
  const smooth = t => {t=clamp(t);return t*t*(3-2*t);};
  const back = t => {t=clamp(t);return 1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2);};
  const easeAlpha = (t,start,end) => clamp((t-start)/(end-start));
  const canvas = sections.map(s => s.querySelector('canvas'));
  const contexts = canvas.map(c => c.getContext('2d'));
  function star(c,x,y,r,rotation=0,color='#ffe284',alpha=1){
    c.save();c.globalAlpha*=clamp(alpha);c.translate(x,y);c.rotate(rotation);
    c.beginPath();for(let n=0;n<10;n++){const a=n*Math.PI/5-Math.PI/2,rr=n%2?r*.47:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();
    const g=c.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#ffffff');g.addColorStop(.35,color);g.addColorStop(1,'#ef9a36');
    c.fillStyle=g;c.strokeStyle='#fff9d6';c.lineWidth=1.7;c.fill();c.stroke();c.restore();
  }
  function bubble(c,x,y,r,alpha=1){
    c.save();c.globalAlpha*=clamp(alpha);const g=c.createRadialGradient(x-r*.32,y-r*.4,r*.05,x,y,r);
    g.addColorStop(0,'#e9ffffe6');g.addColorStop(.3,'#a4f7ff8c');g.addColorStop(.7,'#2fc9ec40');g.addColorStop(1,'#bfe9ffff');
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=g;c.fill();c.strokeStyle='#e7fcff';c.lineWidth=1.6;c.stroke();
    c.beginPath();c.arc(x-r*.27,y-r*.34,r*.22,0,Math.PI*2);c.fillStyle='#ffffff';c.fill();c.restore();
  }
  function flare(c,cx,cy,r,color,alpha){
    c.save();c.globalAlpha*=clamp(alpha);const g=c.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'#fffdf4e6');g.addColorStop(.23,color+'90');g.addColorStop(1,color+'00');c.fillStyle=g;c.fillRect(cx-r,cy-r,r*2,r*2);c.restore();
  }
  function ornament(c,im,x,y,size,scale=1,rotation=0,alpha=1,clip=null,sx=1,sy=1){
    if(alpha<=0||scale<=0)return;c.save();c.translate(x,y);c.rotate(rotation);c.scale(scale*sx,scale*sy);c.globalAlpha*=clamp(alpha);
    if(clip){c.beginPath();clip(c,size);c.clip();}c.drawImage(im,-size/2,-size/2,size,size);c.restore();
  }
  function ring(c,x,y,r,alpha,color,sy=.7){
    c.save();c.globalAlpha*=clamp(alpha);c.translate(x,y);c.scale(1,sy);c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.strokeStyle=color;c.lineWidth=5;c.shadowColor=color;c.shadowBlur=12;c.stroke();c.shadowBlur=0;c.strokeStyle='#ffffff';c.lineWidth=1.5;c.stroke();c.restore();
  }
  function particles(c,s,t,cx,cy){
    const q=t-s.impact;if(q<0)return;
    for(let n=0;n<26;n++){
      const delay=(n%4)*.018,u=q-delay;if(u<0)continue;
      const a=n*2.39996+(s.id==='comet'?-.4:0),life=.65+(n%6)*.07;
      const fade=clamp(u/.06)*clamp((life-u)/.28),travel=1-Math.exp(-u*4.2);
      const radius=50+travel*(110+(n%5)*17),side=s.id==='comet'?u*60:0;
      const x=cx+Math.cos(a)*radius+side,y=cy+Math.sin(a)*radius*.65+(s.id==='bubble-nova'?-u*38:u*u*35);
      if(s.id==='bubble-nova'||n%3===0)bubble(c,x,y,(4+n%4*2)*(1-u*.23),fade);
      else star(c,x,y,5+n%3*2,a+u*3,s.id==='comet'&&n%2?'#b2edff':'#ffe27c',fade);
    }
  }
  function text3d(c,txt,x,y,size,s,white=false){
    c.save();c.font='900 '+size+'px ComboRound, sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.miterLimit=2;
    c.strokeStyle=s.dark;c.lineWidth=size*.13;c.shadowColor=s.dark+'b0';c.shadowBlur=7;c.shadowOffsetY=4;c.strokeText(txt,x,y+2);
    c.shadowBlur=0;c.shadowOffsetY=0;c.strokeStyle='#fff9eb';c.lineWidth=size*.065;c.strokeText(txt,x,y);
    const g=c.createLinearGradient(x,y-size*.5,x,y+size*.55);g.addColorStop(0,'#ffffff');g.addColorStop(.35,white?'#ffffff':'#fff7bf');g.addColorStop(.48,white?'#e9fbff':s.accent);g.addColorStop(1,white?'#a5edff':s.accent);
    c.fillStyle=g;c.fillText(txt,x,y);c.restore();
  }
  function lettering(c,s,t,x,y){
    const start=s.impact+.035,end=s.duration,exit=easeAlpha(t,s.exit+.08,end),a=easeAlpha(t,start,start+.06)*(1-exit);
    if(a<=0)return;let p=clamp((t-start)/.27),scale=mix(.38,1,back(p)),tilt=0,dx=0,dy=0;
    if(s.id==='starburst'){scale=p<.5?mix(1.5,.94,cubic(p*2)):mix(.94,1,smooth((p-.5)*2));dy=-(1-p)*25;}
    if(s.id==='bubble-nova'){scale=mix(.58,1,back(p));dy=Math.sin(p*Math.PI)*-9;}
    if(s.id==='comet'){dx=-90*Math.pow(1-p,3);tilt=-.075*(1-p)+.035;}
    if(s.id==='crown'){dy=-38*(1-cubic(p));scale=mix(.85,1,back(p));}
    c.save();c.globalAlpha=a;c.translate(x+dx,y+dy-exit*18);c.rotate(tilt);c.scale(scale,scale);
    const digits=count.value,sz=digits.length>4?68:80;
    if(s.id==='comet'){
      for(let n=0;n<digits.length;n++){
        const lag=clamp((t-start-n*.03)/.20),shift=(1-cubic(lag))*-22;
        c.save();c.globalAlpha*=clamp(lag*4);text3d(c,digits[n],(n-(digits.length-1)/2)*45,shift,sz,s);c.restore();
      }
    }else text3d(c,digits,0,0,sz,s);
    const labelA=easeAlpha(t,start+.11,start+.20);c.globalAlpha*=labelA;
    text3d(c,'连击',0,57,28,s,true);c.restore();
  }
  function render(index){
    if(!ready)return;const c=contexts[index],s=specs[index],t=states[index].t,im=images[s.id];
    c.clearRect(0,0,540,960);c.drawImage(images.background,483,0,451,802,0,0,540,960);
    if(t<=0||t>=s.duration)return;
    const cx=270,cy=268,size=420;
    const incoming=clamp(t/s.impact),after=t-s.impact,leave=easeAlpha(t,s.exit,s.duration),fade=1-smooth(leave);
    c.save();
    if(t<s.impact){
      const rr=mix(74,14,cubic(incoming));flare(c,cx,cy,80,s.accent,incoming*.45);
      if(s.id==='bubble-nova')bubble(c,cx,cy,22+incoming*54,.3+incoming*.5);
      else if(s.id==='comet'){
        const x=mix(-80,cx,cubic(incoming)),y=mix(cy+140,cy,cubic(incoming));
        c.beginPath();c.moveTo(x-130,y+48);c.lineTo(x,y);c.strokeStyle='#bcecff';c.lineWidth=9;c.stroke();star(c,x,y,17,0,'#ffdb6d');
      }else for(let n=0;n<8;n++){const a=n*Math.PI/4+incoming*.2;star(c,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.7,3+incoming*3,a,s.accent,incoming);}
    }
    if(after>=0){
      const burst=clamp(after/.25),impact=Math.exp(-after*11);
      flare(c,cx,cy,200,s.accent,.46*impact+.13*fade);
      ring(c,cx,cy,25+cubic(after/.45)*225,clamp(1-after/.5)*.6,s.id==='starburst'?'#fff1b0':'#bdf6ff',.65);
      if(s.id==='starburst'){
        const sc=mix(.35,1,back(burst))*(1+leave*.26);
        for(let n=0;n<10;n++){
          const a=n*Math.PI/5-.12,r1=55+cubic(after/.22)*28,r2=80+cubic(after/.4)*165;
          c.save();c.globalAlpha=clamp(1-after/.65)*.4;c.beginPath();c.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.65);c.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2*.65);c.strokeStyle='#fff8ca';c.lineWidth=7*(1-after/.7);c.lineCap='round';c.stroke();c.restore();
        }
        ornament(c,im,cx,cy-5,size,sc,Math.sin(after*17)*.025*Math.exp(-after*5),fade);
      }else if(s.id==='bubble-nova'){
        const expansion=mix(.55,1,back(burst)),spread=cubic(burst)*5+leave*25,rot=Math.sin(after*3)*.07+leave*.12;
        ornament(c,im,cx-spread,cy,size,expansion,-rot,fade,(ctx,z)=>ctx.rect(-z/2,-z/2,z/2,z));
        ornament(c,im,cx+spread,cy,size,expansion,rot,fade,(ctx,z)=>ctx.rect(0,-z/2,z/2,z));
      }else if(s.id==='comet'){
        const p=cubic(after/.25),exitTravel=cubic(leave)*155;
        ornament(c,im,cx-(1-p)*230+exitTravel,cy+(1-p)*70-exitTravel*.35,size,mix(.87,1,p),-.045+leave*.14,fade);
        if(after<.55){const rr=190,a=mix(Math.PI*1.1,Math.PI*2.1,cubic(after/.55));star(c,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.45,15,a,s.accent,1-after/.55);}
      }else{
        const w=back(after/.37),opening=mix(.45,1,w),sway=Math.sin(after*5)*.025,alpha=easeAlpha(after,0,.07)*fade;
        const left=(ctx,z)=>{ctx.moveTo(-z/2,-z/2);ctx.lineTo(-z*.2,-z/2);ctx.lineTo(-z*.2,-z*.035);ctx.lineTo(0,-z*.035);ctx.lineTo(0,z/2);ctx.lineTo(-z/2,z/2);ctx.closePath();};
        const right=(ctx,z)=>{ctx.moveTo(z/2,-z/2);ctx.lineTo(z*.2,-z/2);ctx.lineTo(z*.2,-z*.035);ctx.lineTo(0,-z*.035);ctx.lineTo(0,z/2);ctx.lineTo(z/2,z/2);ctx.closePath();};
        ornament(c,im,cx-leave*20,cy+leave*8,size,1,-sway-leave*.06,alpha,left,opening,1);
        ornament(c,im,cx+leave*20,cy+leave*8,size,1,sway+leave*.06,alpha,right,opening,1);
        const crownP=clamp((after-.12)/.27),drop=-58*(1-back(crownP));
        ornament(c,im,cx,cy+drop-leave*24,size,1,0,easeAlpha(after,.12,.18)*fade,(ctx,z)=>ctx.rect(-z*.2,-z/2,z*.4,z*.465));
      }
      particles(c,s,t,cx,cy);
    }
    lettering(c,s,t,cx,cy+20);
    c.restore();
  }
  function phaseText(s,t){
    if(t===0)return '待触发';if(t>=s.duration)return '演出结束';
    const terms={starburst:['聚光','星芒爆开','数字定格','星屑飞散'], 'bubble-nova':['泡泡蓄能','波纹释放','弹性回落','泡泡散开'],comet:['星光冲入','错拍重击','拖尾环绕','向前飞离'],crown:['星光聚拢','双翼展开 · 皇冠落下','荣耀定格','星光飘散']}[s.id];
    return t<s.impact?terms[0]:t<s.settle?terms[1]:t<s.exit?terms[2]:terms[3];
  }
  function sync(){
    const s=specs[active],t=states[active].t;timeline.max=s.duration;timeline.value=t;
    const phaseLabel=s.name+' · '+phaseText(s,t);if(phase.textContent!==phaseLabel)phase.textContent=phaseLabel;timeLabel.textContent=t.toFixed(2)+' / '+s.duration.toFixed(2)+' 秒';
    play.textContent=running?'重新播放':t>=s.duration?'重播动效':'播放动效';
  }
  function stop(){running=false;cancelAnimationFrame(raf);sync();}
  function tick(now){if(!running)return;const dt=Math.min((now-last)/1000,.05)*Number(speed.value);last=now;states[active].t=Math.min(specs[active].duration,states[active].t+dt);render(active);sync();if(states[active].t>=specs[active].duration){stop();return;}raf=requestAnimationFrame(tick);}
  play.addEventListener('click',()=>{if(!ready)return;stop();states[active].t=0;running=true;last=performance.now();raf=requestAnimationFrame(tick);sync();});
  root.querySelector('[data-action="pause"]').addEventListener('click',stop);
  timeline.addEventListener('input',()=>{const value=Number(timeline.value);stop();states[active].t=value;render(active);sync();});
  count.addEventListener('change',()=>{for(let n=0;n<4;n++)render(n);});
  new MutationObserver(()=>{const next=sections.findIndex(s=>!s.hidden);if(next<0||next===active)return;stop();active=next;render(active);sync();}).observe(root.querySelector('.viz-carousel'),{subtree:true,attributes:true,attributeFilter:['hidden']});
  const loads=Object.entries(data).map(([key,src])=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{images[key]=img;resolve();};img.onerror=reject;img.src=src;}));
  loads.push(document.fonts.load('80px ComboRound','1000连击'));
  Promise.all(loads).then(()=>{ready=true;for(let n=0;n<4;n++)render(n);sync();root.querySelector('[data-label="load"]').textContent=reduced?'预览已就绪，按播放主动观看动效':'四套预览已就绪';}).catch(()=>{root.querySelector('[data-label="load"]').classList.remove('sr-only');root.querySelector('[data-label="load"]').textContent='素材未载入，请重新打开预览。';});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
})();
</script>
