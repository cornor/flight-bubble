<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>伙伴大合照 · 四版明亮配色</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#273144;background:#f4f7fa;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}main{max-width:1620px;margin:auto;padding:30px 28px 38px}
.eyebrow{font-size:11px;letter-spacing:.13em;color:#7a879a}h1{font-size:29px;letter-spacing:-.04em;margin:9px 0}p{line-height:1.65;margin:0}
.intro{font-size:14px;color:#66758a}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.preview{font-size:12px;white-space:nowrap;padding:8px 12px;background:#e8eef5;border-radius:99px;color:#59708d}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.head{display:flex;align-items:center;gap:9px;margin-bottom:8px}h2{font-size:18px;margin:0}.number{display:grid;place-items:center;font-size:11px;font-weight:800;border:1px solid #bac7d7;border-radius:8px;width:29px;height:27px}.desc{font-size:12px;color:#718097;min-height:40px;margin-bottom:13px}
.art{padding:0;display:block;width:100%;border:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 25px #25446612;cursor:zoom-in;transition:transform .16s}
.art:hover{transform:translateY(-3px)}.art:focus-visible{outline:3px solid #367ccd;outline-offset:4px}.art img{display:block;width:100%;height:auto}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:24px;padding-top:19px;border-top:1px solid #dde5ef}.bottom p{font-size:12px;color:#73829a}.link,.ref{font-family:inherit;color:#44678c;font-size:12px}.ref{border:1px solid #b7c7da;border-radius:8px;background:white;padding:9px 14px;cursor:pointer;white-space:nowrap}
dialog{padding:0;border:0;border-radius:14px;max-width:95vw;max-height:96vh;overflow:auto;background:#fff}dialog::backdrop{background:#152338d9;backdrop-filter:blur(5px)}
.toolbar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:20px;justify-content:space-between;background:white;padding:10px 14px;font-size:14px}.toolbar a{font-size:12px;color:#42678f}.toolbar button{border:0;background:#edf1f7;border-radius:7px;padding:7px 12px;cursor:pointer}#detail{display:block;margin:auto;max-width:94vw;max-height:calc(96vh - 52px);object-fit:contain}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}.desc{min-height:0}}
@media(max-width:570px){main{padding:22px 18px}.grid{grid-template-columns:1fr}.topline{display:block}.preview{display:inline-block;margin-top:12px}h1{font-size:24px}.bottom{align-items:flex-start;flex-direction:column}}
</style></head><body><main>
<div class="eyebrow">泡泡小队 / 伙伴大合照 / BRIGHT COLOR STUDIES</div>
<div class="topline"><div><h1>同一张大合照，四种明亮氛围</h1><p class="intro">保留五位伙伴与毛茸茸质感，调整背景、光线和配色。点击任意画面放大对比。</p></div><span class="preview">设计预览 · 尚未接入游戏</span></div>
<section class="grid" aria-label="四版明亮加载页">
<article><div class="head"><span class="number">D1</span><h2>清透天蓝</h2></div><p class="desc">天蓝 × 云朵白，通透、明快，角色轮廓更清楚。</p><button class="art" data-src="D1-sky-blue.png" data-name="D1 · 清透天蓝" aria-label="放大清透天蓝"><img src="D1-sky-blue.png" alt="清透天蓝版五位毛绒伙伴大合照加载页"></button></article>
<article><div class="head"><span class="number">D2</span><h2>明亮珊瑚粉</h2></div><p class="desc">珊瑚粉 × 纯白，延续原版甜美感，去掉泛黄与灰雾。</p><button class="art" data-src="D2-coral-pink.png" data-name="D2 · 明亮珊瑚粉" aria-label="放大明亮珊瑚粉"><img src="D2-coral-pink.png" alt="明亮珊瑚粉版五位毛绒伙伴大合照加载页"></button></article>
<article><div class="head"><span class="number">D3</span><h2>清新薄荷绿</h2></div><p class="desc">薄荷绿 × 冰白，装饰更轻，清新、舒展。</p><button class="art" data-src="D3-fresh-mint.png" data-name="D3 · 清新薄荷绿" aria-label="放大清新薄荷绿"><img src="D3-fresh-mint.png" alt="清新薄荷绿版五位毛绒伙伴大合照加载页"></button></article>
<article><div class="head"><span class="number">D4</span><h2>暖阳奶油色</h2></div><p class="desc">柠檬黄 × 天蓝，明亮暖阳感，保留干净的白色毛绒。</p><button class="art" data-src="D4-lemon-sunshine.png" data-name="D4 · 暖阳奶油色" aria-label="放大暖阳奶油色"><img src="D4-lemon-sunshine.png" alt="暖阳奶油色版五位毛绒伙伴大合照加载页"></button></article>
</section>
<div class="bottom"><p>四版均使用内置 image_gen 基于原图生成。<a class="link" href="prompts.json">查看完整提示词与素材记录</a></p><button class="ref" data-src="../LoadingConcepts-20261024/D-team-portrait.png" data-name="原版 D · 伙伴大合照">查看原版对比 ↗</button></div>
</main>
<dialog id="viewer"><div class="toolbar"><b id="caption"></b><a id="download" download>下载原图</a><button id="close" aria-label="关闭">关闭 ✕</button></div><img id="detail" alt=""></dialog>
<script>
const viewer=document.getElementById('viewer'),detail=document.getElementById('detail');
document.querySelectorAll('[data-src]').forEach(button=>button.addEventListener('click',()=>{
detail.src=button.dataset.src;detail.alt=button.dataset.name;document.getElementById('caption').textContent=button.dataset.name;document.getElementById('download').href=button.dataset.src;viewer.showModal();
}));
document.getElementById('close').addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
</script>
</body></html>
