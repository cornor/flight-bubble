<main>
<header><h1>C 方案：为后续功能留位置</h1><p>标题与伙伴收小一档，两侧各留 2 个入口；开始按钮固定在底部。</p><div class="note">侧栏的签到、排行、活动、任务仅用于演示未来按钮容量。实际没有功能时保持留白，超过 4 个入口时用“更多”收纳低频功能。</div></header>
<section class="grid">
<article><h2>有待解锁的新伙伴</h2><p>显示下一位伙伴和解锁条件，点击进入图鉴。点击图片看原图。</p><a href="01-有新伙伴.png"><img src="01-有新伙伴.png" alt="C 方案，两侧预留四个功能入口，底部显示新伙伴小霞"></a></article>
<article><h2>当前伙伴已全部集齐</h2><p>同一位置切换为集齐状态，点击进入图鉴；开始按钮不移动。</p><a href="02-伙伴已集齐.png"><img src="02-伙伴已集齐.png" alt="C 方案全收集状态：全员集结，小队伙伴已集齐"></a></article>
</section>
<footer><p>后续新增伙伴时，信息条恢复显示新伙伴与解锁条件。两张图的关卡数字均为排版示例。</p><p>本页为内置 imagegen 制作的设计提案，尚未替换游戏主页。 <a href="prompts.json">查看完整提示词与设计规则</a> · <a href="../">返回原四版对比</a></p></footer>
